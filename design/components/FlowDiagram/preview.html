<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FlowDiagram</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Emoji:wght@300..700&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"></head>
<body>
<div class="ty-demo ty-demo--col"><section class="ty-card ty-stack" aria-label="Flow"><h2 class="text-heading ty-flowtitle" style="margin:0">Where October's money went</h2><div class="ty-flowbox"><svg width="640" height="200" viewBox="0 0 640 200" role="group" aria-label="Where October's money went">
<path class="ty-flow ty-chart-hit" d="M12,10 C200,10 200,10 330,10 L330,90 C200,90 200,110 12,110 Z" fill="var(--sec-1)" tabindex="0" role="img" aria-label="Income to Needs 975.00"/>
<path class="ty-flow ty-chart-hit" d="M12,110 C200,110 200,100 330,100 L330,150 C200,150 200,160 12,160 Z" fill="var(--sec-2)" tabindex="0" role="img" aria-label="Income to Wants 390.00"/>
<rect x="0" y="10" width="12" height="150" fill="var(--ink-muted)"/><rect x="330" y="10" width="12" height="80" fill="var(--sec-1)"/><rect x="330" y="100" width="12" height="50" fill="var(--sec-2)"/>
<rect class="ty-labelbg" x="345" y="41" width="130" height="18" rx="4"/><text class="ty-nodelabel" x="348" y="50" dominant-baseline="middle">Needs<tspan class="ty-nodeamt" dx="6">975.00</tspan></text>
<rect class="ty-labelbg" x="345" y="116" width="130" height="18" rx="4"/><text class="ty-nodelabel" x="348" y="125" dominant-baseline="middle">Wants<tspan class="ty-nodeamt" dx="6">390.00</tspan></text>
<text class="ty-nodelabel" x="18" y="180">Paycheck<tspan class="ty-nodeamt" dx="6">2,000.00</tspan></text></svg></div></section></div>
</body>
</html>
