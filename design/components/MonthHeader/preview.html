<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>MonthHeader</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Emoji:wght@300..700&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"></head>
<body>
<div class="ty-demo ty-demo--col"><header class="ty-month">
  <div class="ty-month__top">
    <button class="ty-btn ty-btn--icon" aria-label="Previous month">‹</button>
    <h1 class="text-display">October 2026</h1>
    <button class="ty-btn ty-btn--icon" aria-label="Next month" disabled>›</button>
    <span class="ty-pill ty-pill--positive">Open</span>
    <span class="ty-grow"></span>
    <button class="ty-btn">Close month</button>
    <button class="ty-btn ty-btn--income">Add income</button>
    <button class="ty-btn ty-btn--spend">Add transaction</button>
  </div>
  <div class="ty-stats"><div class="ty-stat"><span class="ty-label">Income</span><span class="num-lg">2,400.00</span></div><div class="ty-stat"><span class="ty-label">Budgeted</span><span class="num-lg">2,400.00</span></div><div class="ty-stat"><span class="ty-label">Spent so far</span><span class="num-lg">1,145.62</span></div><div class="ty-stat"><span class="ty-label">Rest so far</span><span class="num-lg">75.00</span></div></div>
  <button class="ty-btn ty-btn--income ty-month__add">Add income</button>
</header></div>
</body>
</html>
