<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SplitParts</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Emoji:wght@300..700&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"></head>
<body>
<div class="ty-demo ty-demo--col" style="max-width:540px"><fieldset class="ty-fieldset"><legend class="ty-label">Parts</legend>
<div class="ty-parts">
<div class="ty-part"><select class="ty-input" aria-label="Subsection"><option>Food</option></select><input class="ty-input ty-input--amount" aria-label="Amount" value="38.20"><button class="ty-btn ty-btn--quiet" aria-label="Remove part 1" disabled>Remove</button></div>
<div class="ty-part"><select class="ty-input" aria-label="Subsection"><option>Gifts</option></select><input class="ty-input ty-input--amount" aria-label="Amount" value="6.00"><button class="ty-btn ty-btn--quiet" aria-label="Remove part 2" disabled>Remove</button></div>
</div>
<div class="ty-partfoot"><button type="button" class="ty-btn ty-btn--quiet">+ Add part</button><span class="ty-cap">Left to split 4.00</span><button type="button" class="ty-btn ty-btn--quiet">Remove split</button></div>
</fieldset></div>
</body>
</html>
