<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SummaryCard</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Emoji:wght@300..700&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"></head>
<body>
<div class="ty-demo ty-demo--col" style="max-width:340px"><section class="ty-summary" aria-label="Assets"><div class="ty-summary__head"><h2 class="text-title">Assets</h2><span class="ty-num">17,092.55</span></div>
<div class="ty-stackbar" role="img" aria-label="Investments 60%, Cash 40%"><span class="ty-seg--1" style="flex:10269.8"></span><span class="ty-seg--5" style="flex:6822.75"></span></div>
<ul class="ty-keys"><li><span class="ty-dot ty-dot--1"></span><span>Investments</span><span class="ty-num">10,269.80</span></li><li><span class="ty-dot ty-dot--5"></span><span>Cash</span><span class="ty-num">6,822.75</span></li></ul></section>
<section class="ty-summary" aria-label="Debts"><div class="ty-summary__head"><h2 class="text-title">Debts</h2><span class="ty-num ty-num--neg">−4,881.15</span></div>
<div class="ty-stackbar" role="img" aria-label="Car loan 100%"><span class="ty-seg--6" style="flex:1"></span></div>
<ul class="ty-keys"><li><span class="ty-dot ty-dot--6"></span><span>Car loan</span><span class="ty-num">−4,881.15</span></li></ul></section></div>
</body>
</html>
