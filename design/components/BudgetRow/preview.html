<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>BudgetRow</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"></head>
<body>
<div class="ty-demo ty-demo--col"><div class="ty-section">
<div class="ty-brow">
  <div class="ty-brow__name">
    <div class="ty-brow__title"><span>Food</span><span class="ty-cap">rolls over up to 100.00</span></div>
    <div class="ty-meter" role="img" aria-label="212.40 of 300.00 spent"><span style="width:71%"></span></div>
    <div class="ty-cap ty-brow__sub">212.40 of 300.00 spent</div>
  </div>
  <div class="ty-num ty-right ty-wide">300.00</div>
  <div class="ty-num ty-right ty-wide">212.40</div>
  <div class="ty-right"><span class="ty-pill ty-pill--positive">87.60</span></div>
</div>
<div class="ty-brow">
  <div class="ty-brow__name">
    <div class="ty-brow__title"><span>Subscriptions</span><span class="ty-cap"></span></div>
    <div class="ty-meter ty-meter--warning" role="img" aria-label="38.97 of 40.00 spent"><span style="width:97%"></span></div>
    <div class="ty-cap ty-brow__sub">38.97 of 40.00 spent</div>
  </div>
  <div class="ty-num ty-right ty-wide">40.00</div>
  <div class="ty-num ty-right ty-wide">38.97</div>
  <div class="ty-right"><span class="ty-pill ty-pill--warning">1.03 left</span></div>
</div>
<div class="ty-brow">
  <div class="ty-brow__name">
    <div class="ty-brow__title"><span>Utilities</span><span class="ty-cap"></span></div>
    <div class="ty-meter ty-meter--negative" role="img" aria-label="131.75 of 120.00 spent"><span style="width:100%"></span></div>
    <div class="ty-cap ty-brow__sub">131.75 of 120.00 spent</div>
  </div>
  <div class="ty-num ty-right ty-wide">120.00</div>
  <div class="ty-num ty-right ty-wide">131.75</div>
  <div class="ty-right"><span class="ty-pill ty-pill--negative">−11.75 over</span></div>
</div>
<div class="ty-brow">
  <div class="ty-brow__name">
    <div class="ty-brow__title"><span>Car</span><span class="ty-cap">fills to 15,000.00</span></div>
    <div class="ty-meter ty-meter--goal" role="img" aria-label="6,300.00 of 15,000.00 saved"><span style="width:42%"></span></div>
    <div class="ty-cap ty-brow__sub">6,300.00 of 15,000.00 saved</div>
  </div>
  <div class="ty-num ty-right ty-wide">300.00</div>
  <div class="ty-num ty-right ty-wide">6,300.00</div>
  <div class="ty-right"><span class="ty-pill">42% of 15,000</span></div>
</div>
</div></div>
</body>
</html>
