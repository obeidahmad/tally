<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AllocationBar</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"></head>
<body>
<div class="ty-demo ty-demo--col"><div class="ty-card ty-stack" style="gap:24px"><div class="ty-alloc">
  <div class="ty-alloc__head"><b>Paycheck</b><span class="ty-num">2,000.00</span><span class="ty-cap">Zakat takes 50.00 first, the other 1,950.00 is split</span></div>
  <div class="ty-alloc__bar" role="img" aria-label="Zakat 50.00, Needs 975.00, Wants 390.00, Savings 585.00"><span class="ty-seg--4" style="flex:50"></span><span class="ty-seg--1" style="flex:975"></span><span class="ty-seg--2" style="flex:390"></span><span class="ty-seg--3" style="flex:585"></span></div>
  <ul class="ty-alloc__legend">
    <li><span class="ty-dot ty-dot--4"></span>Zakat <span class="ty-num">50.00</span><span class="ty-cap">2.5% first</span></li>
    <li><span class="ty-dot ty-dot--1"></span>Needs <span class="ty-num">975.00</span><span class="ty-cap">50%</span></li>
    <li><span class="ty-dot ty-dot--2"></span>Wants <span class="ty-num">390.00</span><span class="ty-cap">20%</span></li>
    <li><span class="ty-dot ty-dot--3"></span>Savings <span class="ty-num">585.00</span><span class="ty-cap">30%</span></li>
  </ul>
</div><div class="ty-alloc">
  <div class="ty-alloc__head"><b>Leftover from September</b><span class="ty-num">400.00</span><span class="ty-cap">no Zakat on this income</span></div>
  <div class="ty-alloc__bar" role="img" aria-label="Needs 200.00, Savings 200.00"><span class="ty-seg--1" style="flex:1"></span><span class="ty-seg--3" style="flex:1"></span></div>
  <ul class="ty-alloc__legend">
    <li><span class="ty-dot ty-dot--1"></span>Needs <span class="ty-num">200.00</span><span class="ty-cap">50%</span></li>
    <li><span class="ty-dot ty-dot--3"></span>Savings <span class="ty-num">200.00</span><span class="ty-cap">50%</span></li>
  </ul>
</div></div></div>
</body>
</html>
