<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"></head>
<body>
<div class="ty-scrim">
<div class="ty-dialog" role="dialog" aria-labelledby="dt">
  <div><h2 class="text-title" id="dt">Close October</h2><p class="ty-cap" style="margin:4px 0 0">Needs has a rest of 75.00 that no subsection claimed. Choose where it goes.</p></div>
  <div class="ty-stack">
    <div class="ty-restrow"><label for="r1">Keep in Needs for November</label><div class="ty-affix"><input class="ty-input ty-input--amount" id="r1" value="25.00"><span class="ty-muted">EUR</span></div></div>
    <div class="ty-restrow"><label for="r2" class="ty-tag"><span class="ty-dot ty-dot--3"></span>Move to Savings</label><div class="ty-affix"><input class="ty-input ty-input--amount" id="r2" value="30.00"><span class="ty-muted">EUR</span></div></div>
    <div class="ty-restrow"><label for="r3">Count as income in November</label><div class="ty-affix"><input class="ty-input ty-input--amount" id="r3" value="20.00"><span class="ty-muted">EUR</span></div></div>
    <div class="ty-sum"><span>Placed</span><span class="ty-num">75.00 of 75.00</span></div>
  </div>
  <div class="ty-dialog__foot"><button class="ty-btn ty-btn--quiet">Cancel</button><button class="ty-btn ty-btn--primary">Close October</button></div>
</div></div>
</body>
</html>
