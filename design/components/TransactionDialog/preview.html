<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TransactionDialog</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Emoji:wght@300..700&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"></head>
<body>
<div class="ty-scrim">
<div class="ty-dialog" role="dialog" aria-labelledby="tt">
  <h2 class="text-title" id="tt">Add income</h2>
  <fieldset class="ty-fieldset"><legend class="ty-label">Type</legend><div class="ty-segmented"><label><input type="radio" name="type">Expense</label><label><input type="radio" name="type" checked>Income</label></div></fieldset>
  <div class="ty-field"><label class="ty-label" for="td">Date</label><input class="ty-input" id="td" type="date" value="2026-10-12"></div>
  <div class="ty-field"><label class="ty-label" for="ta">Amount</label><div class="ty-affix"><input class="ty-input ty-input--amount" id="ta" value="2000.00" inputmode="decimal"><span class="ty-muted">EUR</span></div></div>
  <fieldset class="ty-fieldset"><legend class="ty-label">Received from</legend><div class="ty-chips"><label class="ty-chip"><input type="radio" name="source" checked>Paycheck</label><label class="ty-chip"><input type="radio" name="source">Second job</label><label class="ty-chip ty-chip--add"><input type="radio" name="source">+ Add source</label></div></fieldset>
  <fieldset class="ty-fieldset"><legend class="ty-label">Paid into</legend><div class="ty-chips"><label class="ty-chip"><input type="radio" name="pocket"><span class="ty-emoji">🏦</span>Bank of Cyprus</label><label class="ty-chip"><input type="radio" name="pocket"><span class="ty-emoji">💵</span>Cash</label><label class="ty-chip ty-chip--add"><input type="radio" name="pocket" checked>+ Add pocket</label></div>
    <div class="ty-pair"><div class="ty-field"><label class="ty-label" for="pn">Pocket name</label><input class="ty-input" id="pn" value="Revolut"></div>
    <div class="ty-field"><label class="ty-label" for="pk">Kind</label><select class="ty-input" id="pk"><option>Bank account</option><option>Cash</option><option>Fund</option><option>Broker</option></select></div></div>
  </fieldset>
  <div class="ty-field"><label class="ty-label" for="tn">Note (optional)</label><input class="ty-input" id="tn"></div>
  <div class="ty-dialog__foot"><button class="ty-btn ty-btn--quiet">Cancel</button><button class="ty-btn ty-btn--primary">Add income</button></div>
</div></div>
</body>
</html>
