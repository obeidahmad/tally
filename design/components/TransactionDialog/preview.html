<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TransactionDialog</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Emoji:wght@300..700&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"></head>
<body>
<div class="ty-scrim">
<div class="ty-dialog" role="dialog" aria-labelledby="tt">
  <h2 class="text-title" id="tt">Add income</h2>
  <fieldset class="ty-fieldset"><legend class="ty-label">Type</legend><div class="ty-segmented"><label><input type="radio" name="type">Expense</label><label><input type="radio" name="type" checked>Income</label></div></fieldset>
  <div class="ty-field"><label class="ty-label" for="td">Date</label><input class="ty-input" id="td" type="date" value="2026-10-12"></div>
  <div class="ty-field"><label class="ty-label" for="ta">Amount</label><div class="ty-affix"><input class="ty-input ty-input--amount" id="ta" value="2000.00" inputmode="decimal"><span class="ty-muted">EUR</span></div></div>
  <fieldset class="ty-fieldset"><legend class="ty-label">Source</legend><div class="ty-chips"><label class="ty-chip"><input type="radio" name="source" checked>Paycheck</label><label class="ty-chip"><input type="radio" name="source">Second job</label><label class="ty-chip ty-chip--add"><input type="radio" name="source">+ Add source</label></div></fieldset>
  <fieldset class="ty-fieldset"><legend class="ty-label">Pocket</legend><div class="ty-chips"><label class="ty-chip"><input type="radio" name="pocket"><span class="ty-emoji">🏦</span> Bank of Cyprus</label><label class="ty-chip"><input type="radio" name="pocket"><span class="ty-emoji">💵</span> Cash</label><label class="ty-chip ty-chip--add"><input type="radio" name="pocket" checked>+ Add pocket</label></div>
    <div class="ty-inset">
      <div class="ty-field"><label class="ty-label" for="pn">Pocket name</label><input class="ty-input" id="pn" value="Revolut"></div>
      <fieldset class="ty-fieldset"><legend class="ty-label">Emoji</legend><div class="ty-emojis ty-emoji"><label><input type="radio" name="pe" aria-label="Bank">🏦</label><label><input type="radio" name="pe" aria-label="Card" checked>💳</label><label><input type="radio" name="pe" aria-label="Banknote">💵</label><label><input type="radio" name="pe" aria-label="Euro note">💶</label><label><input type="radio" name="pe" aria-label="Pound note">💷</label><label><input type="radio" name="pe" aria-label="Money bag">💰</label><label><input type="radio" name="pe" aria-label="Coin">🪙</label><label><input type="radio" name="pe" aria-label="Purse">👛</label><label><input type="radio" name="pe" aria-label="Piggy bank">🐷</label><label><input type="radio" name="pe" aria-label="Chart">📈</label><label><input type="radio" name="pe" aria-label="Seedling">🌱</label><label><input type="radio" name="pe" aria-label="Gem">💎</label><label><input type="radio" name="pe" aria-label="Lock">🔒</label><label><input type="radio" name="pe" aria-label="House">🏠</label><label><input type="radio" name="pe" aria-label="Car">🚗</label><label><input type="radio" name="pe" aria-label="Plane">✈</label><label><input type="radio" name="pe" aria-label="Gift">🎁</label><label><input type="radio" name="pe" aria-label="Graduation cap">🎓</label><label><input type="radio" name="pe" aria-label="Baby">👶</label><label><input type="radio" name="pe" aria-label="Heart">❤</label><label><input type="radio" name="pe" aria-label="Star">⭐</label><label><input type="radio" name="pe" aria-label="Umbrella">☂</label><label><input type="radio" name="pe" aria-label="Shopping cart">🛒</label><label><input type="radio" name="pe" aria-label="Briefcase">💼</label><label><input type="radio" name="pe" aria-label="Phone">📱</label><label><input type="radio" name="pe" aria-label="Globe">🌍</label><label><input type="radio" name="pe" aria-label="Beach">🏖</label><label><input type="radio" name="pe" aria-label="Tools">🛠</label><label><input type="radio" name="pe" aria-label="Target">🎯</label><label><input type="radio" name="pe" aria-label="Receipt">🧾</label><label><input type="radio" name="pe" aria-label="Open hands">🤲</label><label><input type="radio" name="pe" aria-label="Mosque">🕌</label></div></fieldset>
      <div class="ty-field"><label class="ty-label" for="pk">Kind</label><select class="ty-input" id="pk"><option>Bank account</option><option>Cash</option><option>Fund</option><option>Broker</option></select></div>
    </div>
  </fieldset>
  <div class="ty-field"><label class="ty-label" for="tn">Note (optional)</label><input class="ty-input" id="tn"></div>
  <div class="ty-dialog__foot"><button class="ty-btn ty-btn--quiet">Cancel</button><button class="ty-btn ty-btn--income">Add income</button></div>
</div></div>
</body>
</html>
