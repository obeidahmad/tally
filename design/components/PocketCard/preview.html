<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PocketCard</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Emoji:wght@300..700&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"></head>
<body>
<div class="ty-demo ty-demo--col"><section class="ty-section" aria-label="Pockets">
<div class="ty-prow" role="button" tabindex="0">
  <div class="ty-prow__who"><span class="ty-prow__name"><span class="ty-emoji">🏦</span> <b>Bank of Cyprus</b><span class="ty-cap">Bank account</span></span><span class="ty-cap">Synced 2 hours ago</span></div>
  <div class="ty-prow__bal"><span class="ty-num">3,180.40<span class="ty-cur">EUR</span></span></div>
</div>
<div class="ty-prow" role="button" tabindex="0">
  <div class="ty-prow__who"><span class="ty-prow__name"><span class="ty-emoji">🌍</span> <b>Revolut USD</b><span class="ty-cap">Bank account</span></span><span class="ty-cap">Synced 2 hours ago</span></div>
  <div class="ty-prow__bal"><span class="ty-num">1,240.00<span class="ty-cur">USD</span></span><span class="ty-cap">≈ 1,141.80 EUR</span></div>
</div>
<div class="ty-prow" role="button" tabindex="0">
  <div class="ty-prow__who"><span class="ty-prow__name"><span class="ty-emoji">📈</span> <b>Trading212</b><span class="ty-cap">Broker</span></span><span class="ty-cap">Synced today</span></div>
  <div class="ty-prow__bal"><span class="ty-num">2,310.00<span class="ty-cur">USD</span></span><span class="ty-cap">≈ 2,127.05 EUR · paid 2,100.00 USD</span></div>
</div>
</section></div>
</body>
</html>
