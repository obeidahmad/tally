<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TagInput</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Emoji:wght@300..700&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"></head>
<body>
<div class="ty-demo ty-demo--col" style="max-width:360px"><div class="ty-field"><label class="ty-label" for="tg">Tags</label>
<div class="ty-taglist"><span class="ty-pill ty-tagpill"><span>holiday</span><button type="button" aria-label="Remove tag holiday">×</button></span><span class="ty-pill ty-tagpill"><span>cyprus</span><button type="button" aria-label="Remove tag cyprus">×</button></span></div>
<input class="ty-input" id="tg" value="gi" autocomplete="off">
<div class="ty-chips"><button type="button" class="ty-chip">gifts</button><button type="button" class="ty-chip">gift-cards</button></div></div></div>
</body>
</html>
