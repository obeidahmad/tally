<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Emoji:wght@300..700&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"></head>
<body>
<div class="ty-demo">
<button class="ty-btn ty-btn--primary">Add transaction</button>
<button class="ty-btn">Add income</button>
<button class="ty-btn ty-btn--quiet">Cancel</button>
<button class="ty-btn ty-btn--danger">Delete pocket</button>
<button class="ty-btn ty-btn--icon" aria-label="Previous month">‹</button>
<button class="ty-btn ty-btn--icon" aria-label="Switch to dark mode"><svg class="ty-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
<button class="ty-btn ty-btn--sm">Edit</button>
<button class="ty-btn" disabled>Save</button>
</div>
</body>
</html>
