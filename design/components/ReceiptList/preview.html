<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ReceiptList</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Emoji:wght@300..700&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"></head>
<body>
<div class="ty-demo ty-demo--col" style="max-width:480px">
<div class="ty-field"><span class="ty-label">Receipts</span>
<ul class="ty-files"><li><a class="ty-link" href="#">alphamega-16-oct.pdf</a><span class="ty-cap">84 KB</span><button type="button" class="ty-btn ty-btn--quiet" aria-label="Remove alphamega-16-oct.pdf">Remove</button></li></ul>
<div><label class="ty-btn ty-attach">Attach receipt<input type="file" style="position:absolute;width:1px;height:1px;opacity:0" accept="application/pdf"></label></div></div>
<div class="ty-inset">
<div class="ty-value"><span class="ty-label">Current value</span><span class="ty-num">142,000.00<span class="ty-cur">EUR</span></span></div>
<div class="ty-valuerow"><div class="ty-field"><label class="ty-label" for="pv">Value</label><input class="ty-input ty-input--amount" id="pv" value="145,000.00"></div><div class="ty-field"><label class="ty-label" for="pd">Date</label><input class="ty-input" id="pd" value="2026-10-16"></div><button type="button" class="ty-btn">Update value</button></div>
<ul class="ty-files"><li><span>1 July</span><span class="ty-num">142,000.00</span><button type="button" class="ty-btn ty-btn--quiet" aria-label="Remove the value of 1 July">Remove</button></li><li><span>1 January</span><span class="ty-num">135,000.00</span><button type="button" class="ty-btn ty-btn--quiet" aria-label="Remove the value of 1 January">Remove</button></li></ul>
</div></div>
</body>
</html>
