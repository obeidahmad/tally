<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PocketCard</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css"></head>
<body>
<div class="ty-demo ty-demo--col"><div class="ty-grid"><article class="ty-card ty-pocket">
  <div class="ty-pocket__top"><div class="ty-grow"><b>Bank of Cyprus</b><span class="ty-cap">Bank account</span></div><span class="ty-pill">EUR</span></div>
  <div><div class="num-lg">3,180.40<span class="ty-cur">EUR</span></div><div class="ty-cap"> </div></div>
  <div class="ty-cap">Synced 2 hours ago</div>
</article><article class="ty-card ty-pocket">
  <div class="ty-pocket__top"><div class="ty-grow"><b>Revolut USD</b><span class="ty-cap">Bank account</span></div><span class="ty-pill">USD</span></div>
  <div><div class="num-lg">1,240.00<span class="ty-cur">USD</span></div><div class="ty-cap">≈ 1,141.80 EUR</div></div>
  <div class="ty-cap">Synced 2 hours ago</div>
</article><article class="ty-card ty-pocket">
  <div class="ty-pocket__top"><div class="ty-grow"><b>Trading212</b><span class="ty-cap">Broker</span></div><span class="ty-pill">USD</span></div>
  <div><div class="num-lg">2,310.00<span class="ty-cur">USD</span></div><div class="ty-cap">≈ 2,127.05 EUR · paid 2,100.00 USD</div></div>
  <div class="ty-cap">Synced today</div>
</article></div></div>
</body>
</html>
